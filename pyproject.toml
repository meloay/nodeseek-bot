[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "nodeseek-keyword-bot"
version = "0.2.0"
description = "NodeSeek RSS keyword monitor with Telegram notifications"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "curl-cffi>=0.13,<1",
  "feedparser>=6.0.11,<7",
  "httpx>=0.27,<1",
  "python-telegram-bot[job-queue]>=22.0,<23",
  "PyYAML>=6.0,<7",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
  "pytest-asyncio>=0.24,<2",
  "ruff>=0.9,<1",
]

[project.scripts]
nodeseek-bot = "nodeseek_bot.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
